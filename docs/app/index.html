<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de evacuación</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header><h1>Ruta de evacuación · CBTis 188</h1></header>

<main id="principal">
  <!-- Sin cartel escaneado -->
  <section id="inicio">
    <h2>Escanee un cartel</h2>
    <p id="msgInicio" role="status"></p>
    <div class="fila"><a class="boton peligro" href="tel:911">Llamar al 911</a></div>
    <p id="aviso" class="aviso"></p>
  </section>

  <!-- Ruta en marcha (todo automático) -->
  <section id="nav" hidden>
    <div id="banner" aria-live="assertive" aria-atomic="true">
      <svg id="icono" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div><p id="titulo" class="titulo"></p><p id="detalle" class="detalle"></p></div>
    </div>
    <div id="estado"><span id="falta"></span><span id="piso"></span></div>
    <canvas id="croquis" role="img" aria-label="Croquis del plantel con su posición y la ruta a la salida"></canvas>
    <p id="toque" class="suave" hidden>Toque la pantalla una vez para activar la voz.</p>
    <div class="fila"><a class="boton peligro" href="tel:911">Llamar al 911</a></div>
    <p class="aviso">Siga la voz. Si la ruta se corta, escanee otro cartel con la cámara del celular y se corrige sola.</p>
  </section>
</main>

<script src="plantel.js"></script>
<script src="motor.js"></script>
<script src="app.js"></script>
</body>
</html>
