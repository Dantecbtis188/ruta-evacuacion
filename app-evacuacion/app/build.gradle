// Datos de la aplicación.
plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.edu.rutaevacuacion'      // identificador único de la app
    compileSdk 34

    defaultConfig {
        applicationId 'mx.edu.rutaevacuacion'
        minSdk 26                          // Android 8.0 o más nuevo
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No lleva librerías extra: la app solo abre la página guardada dentro de ella.
